name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SCHEME: VLC-iOS-no-watch
      CONFIGURATION: Release
      DERIVED_DATA_PATH: ${{ github.workspace }}/build/DerivedData
      SOURCE_PACKAGES_PATH: ${{ github.workspace }}/build/SourcePackages
      OUTPUT_PATH: ${{ github.workspace }}/build/output
      VLC_UPSTREAM_REPOSITORY: https://code.videolan.org/videolan/vlc-ios.git
      VLC_UPSTREAM_REVISION: 31bc381f42a0d3d6af9380970b57ebd5c143192e

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reconstruct pinned upstream base
        run: |
          set -euo pipefail

          upstream_root="$RUNNER_TEMP/vlc-ios-upstream"
          mkdir -p "$upstream_root"

          customized_files=(
            'Resources/en.lproj/Localizable.strings'
            'Sources/App/VLCAppCoordinator.m'
            'Sources/App/iOS/VLCAppDelegate.m'
            'Sources/Headers/VLCConstants.h'
            'Sources/Helpers/Thumbnail Cache/VLCThumbnailsCache.h'
            'Sources/Helpers/Thumbnail Cache/VLCThumbnailsCache.m'
            'Sources/Media Library/MediaCategories/MediaCategoryViewController.swift'
            'Sources/Media Library/MediaLibraryModel/MediaLibraryBaseModel.swift'
            'Sources/Media Library/MediaLibraryModel/MediaModel.swift'
            'Sources/Media Library/MediaLibraryModel/PlaylistModel.swift'
            'Sources/Media Library/MediaLibraryService.swift'
            'Sources/Playback/Control/VLCPlaybackService.m'
            'Sources/Playback/OS Integration/VLCMetadata.m'
            'Sources/Playback/Player/AudioPlayer/AudioPlayerView.swift'
            'Sources/Playback/Player/AudioPlayer/AudioPlayerViewController.swift'
            'Sources/Playback/Player/MiniPlayer-iOS/AudioMiniPlayer.swift'
            'Sources/Playback/Player/VideoPlayer-iOS/MediaMoreOptionsActionSheet.swift'
            'Sources/Playback/Player/VideoPlayer-iOS/Subviews/MediaPlayerActionSheet.swift'
            'Sources/Podcasts/Views/PodcastArtworkView.swift'
            'Sources/WiFi Sharing/VLCHTTPConnection.m'
          )

          is_customized_file() {
            local candidate="$1"
            local customized_file
            for customized_file in "${customized_files[@]}"; do
              if [[ "$candidate" == "$customized_file" ]]; then
                return 0
              fi
            done
            return 1
          }

          missing_customizations=()
          for customized_file in "${customized_files[@]}"; do
            if [[ ! -f "$GITHUB_WORKSPACE/$customized_file" ]]; then
              missing_customizations+=("$customized_file")
            fi
          done

          if (( ${#missing_customizations[@]} > 0 )); then
            printf 'The fork is missing customized source files:\n' >&2
            printf '  %s\n' "${missing_customizations[@]}" >&2
            exit 1
          fi

          git remote add vlc-upstream "$VLC_UPSTREAM_REPOSITORY"
          git fetch --no-tags --depth=1 vlc-upstream "$VLC_UPSTREAM_REVISION"
          git archive --format=tar FETCH_HEAD | tar -xf - -C "$upstream_root"

          # The fork contains files from several VLC revisions. Rebuild a coherent
          # source tree from the pinned revision while preserving this feature's
          # intentionally customized source files.
          # Keep only Actions/Git metadata and this feature's documentation
          # outside the pinned source tree. Excluded paths are protected from
          # --delete by rsync unless --delete-excluded is also supplied.
          rsync_options=(
            -a
            --delete
            '--exclude=/.git/'
            '--exclude=/.github/'
            '--exclude=/Documentation/GitHub-Actions-IPA.md'
          )
          for customized_file in "${customized_files[@]}"; do
            rsync_options+=("--exclude=/$customized_file")
          done
          rsync "${rsync_options[@]}" "$upstream_root/" "$GITHUB_WORKSPACE/"

          mismatched_upstream_files=()
          checked_upstream_files=0
          while IFS= read -r -d '' upstream_file; do
            relative_path="${upstream_file#"$upstream_root/"}"
            if is_customized_file "$relative_path"; then
              continue
            fi

            checked_upstream_files=$((checked_upstream_files + 1))
            if [[ ! -f "$GITHUB_WORKSPACE/$relative_path" ]] || \
               ! cmp -s "$upstream_file" "$GITHUB_WORKSPACE/$relative_path"; then
              mismatched_upstream_files+=("$relative_path")
            fi
          done < <(find "$upstream_root" -type f -print0)

          if (( ${#mismatched_upstream_files[@]} > 0 )); then
            printf 'Source reconstruction left files inconsistent with the pinned upstream revision:\n' >&2
            printf '  %s\n' "${mismatched_upstream_files[@]}" >&2
            exit 1
          fi

          unexpected_workspace_files=()
          while IFS= read -r -d '' workspace_file; do
            relative_path="${workspace_file#"$GITHUB_WORKSPACE/"}"
            if is_customized_file "$relative_path" || \
               [[ -f "$upstream_root/$relative_path" ]]; then
              continue
            fi
            unexpected_workspace_files+=("$relative_path")
          done < <(find "$GITHUB_WORKSPACE" -type f \
            ! -path "$GITHUB_WORKSPACE/.git/*" \
            ! -path "$GITHUB_WORKSPACE/.github/*" \
            ! -path "$GITHUB_WORKSPACE/Documentation/GitHub-Actions-IPA.md" \
            -print0)

          if (( ${#unexpected_workspace_files[@]} > 0 )); then
            printf 'Unexpected files remain outside the pinned source tree:\n' >&2
            printf '  %s\n' "${unexpected_workspace_files[@]}" >&2
            exit 1
          fi

          # Guard the resolution fix itself. A stale customization manifest used
          # to let rsync silently restore upstream's 1024-pixel artwork path.
          artwork_guards=(
            'Sources/Helpers/Thumbnail Cache/VLCThumbnailsCache.m|VLC_ORIGINAL_PIXEL_SIZE'
            'Sources/Media Library/MediaLibraryModel/MediaModel.swift|final class AudioArtworkProvider'
            'Sources/Media Library/MediaLibraryModel/MediaModel.swift|options: [.parse, .fetchLocal]'
            'Sources/Media Library/MediaLibraryModel/MediaModel.swift|originalArtworkData(from: media)'
            'Sources/Media Library/MediaLibraryModel/MediaLibraryBaseModel.swift|track.artworkImage()'
            'Sources/Media Library/MediaLibraryModel/PlaylistModel.swift|iter.artworkImage()'
            'Sources/Media Library/MediaLibraryService.swift|prefetchEmbeddedAudioArtwork()'
            'Sources/Playback/Control/VLCPlaybackService.m|mediaDidChangeArtwork:'
            'Sources/Playback/OS Integration/VLCMetadata.m|embeddedArtwork'
            'Sources/Media Library/MediaCategories/MediaCategoryViewController.swift|Never mount the legacy standalone UISearchBar'
          )
          missing_artwork_guards=()
          for guard_entry in "${artwork_guards[@]}"; do
            guard_file="${guard_entry%%|*}"
            guard_pattern="${guard_entry#*|}"
            if ! grep -Fq "$guard_pattern" "$GITHUB_WORKSPACE/$guard_file"; then
              missing_artwork_guards+=("$guard_file -> $guard_pattern")
            fi
          done

          if (( ${#missing_artwork_guards[@]} > 0 )); then
            printf 'Original-resolution artwork guards were lost during reconstruction:\n' >&2
            printf '  %s\n' "${missing_artwork_guards[@]}" >&2
            exit 1
          fi

          forbidden_artwork_patterns=(
            'Sources/Media Library/MediaLibraryService.swift|originalAudioArtworkMigrationVersion'
            'Sources/Media Library/MediaLibraryService.swift|requestOriginalAudioArtwork'
            'Sources/Media Library/MediaLibraryService.swift|forceParserRetry()'
          )
          present_forbidden_patterns=()
          for guard_entry in "${forbidden_artwork_patterns[@]}"; do
            guard_file="${guard_entry%%|*}"
            guard_pattern="${guard_entry#*|}"
            if grep -Fq "$guard_pattern" "$GITHUB_WORKSPACE/$guard_file"; then
              present_forbidden_patterns+=("$guard_file -> $guard_pattern")
            fi
          done

          if (( ${#present_forbidden_patterns[@]} > 0 )); then
            printf 'Destructive audio-artwork migration code is still present:\n' >&2
            printf '  %s\n' "${present_forbidden_patterns[@]}" >&2
            exit 1
          fi

          printf 'Verified %s upstream files and preserved %s customized source files.\n' \
            "$checked_upstream_files" "${#customized_files[@]}"

      - name: Verify all bridging-header imports
        run: |
          set -euo pipefail

          missing_imports=()
          ambiguous_imports=()
          checked_imports=0

          while IFS= read -r bridge; do
            while IFS= read -r imported_header; do
              [[ -z "$imported_header" ]] && continue
              checked_imports=$((checked_imports + 1))

              if [[ "$imported_header" == */* ]]; then
                candidate="$(dirname "$bridge")/$imported_header"
                if [[ ! -f "$candidate" ]]; then
                  missing_imports+=("$bridge -> $imported_header")
                fi
                continue
              fi

              matches="$(find Sources Buildsystem -type f -name "$imported_header" -print)"
              match_count="$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')"
              if [[ "$match_count" -eq 0 ]]; then
                missing_imports+=("$bridge -> $imported_header")
              elif [[ "$match_count" -gt 1 ]]; then
                ambiguous_imports+=("$bridge -> $imported_header: $matches")
              fi
            done < <(sed -nE 's/^[[:space:]]*#import[[:space:]]+"([^"]+)".*/\1/p' "$bridge")
          done < <(find Sources Buildsystem -type f -name '*Bridging-Header.h' -print | sort)

          if (( ${#missing_imports[@]} > 0 || ${#ambiguous_imports[@]} > 0 )); then
            if (( ${#missing_imports[@]} > 0 )); then
              printf 'Missing local bridging-header imports after upstream restoration:\n' >&2
              printf '  %s\n' "${missing_imports[@]}" >&2
            fi
            if (( ${#ambiguous_imports[@]} > 0 )); then
              printf 'Ambiguous local bridging-header imports:\n' >&2
              printf '  %s\n' "${ambiguous_imports[@]}" >&2
            fi
            exit 1
          fi

          printf 'Verified %s local imports across every bridging header.\n' "$checked_imports"

      - name: Show build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          pod --version

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          pod install --repo-update

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -workspace VLC.xcworkspace \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH"

      - name: Build iPhoneOS app without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace VLC.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -onlyUsePackageVersionsFromResolvedFile \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            'HEADER_SEARCH_PATHS=$(inherited) $(SRCROOT)/Sources/**'

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          app_path="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION-iphoneos/VLC-iOS-no-watch.app"
          if [[ ! -d "$app_path" ]]; then
            echo "Expected app was not produced: $app_path" >&2
            find "$DERIVED_DATA_PATH/Build/Products" -maxdepth 3 -name '*.app' -print || true
            exit 1
          fi

          package_root="$(mktemp -d)"
          mkdir -p "$package_root/Payload" "$OUTPUT_PATH"
          ditto "$app_path" "$package_root/Payload/VLC-iOS-no-watch.app"

          ipa_path="$OUTPUT_PATH/VLC-iOS-unsigned-${GITHUB_RUN_NUMBER}.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$package_root/Payload" "$ipa_path"
          shasum -a 256 "$ipa_path" > "$ipa_path.sha256"

          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
          ls -lh "$ipa_path" "$ipa_path.sha256"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VLC-iOS-unsigned-ipa-${{ github.run_number }}
          path: |
            ${{ env.OUTPUT_PATH }}/*.ipa
            ${{ env.OUTPUT_PATH }}/*.sha256
          if-no-files-found: error
          retention-days: 14
